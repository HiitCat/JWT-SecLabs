<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VaultBox - Admin Console</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%23d29922'/><text y='22' x='16' text-anchor='middle' font-size='18' font-family='monospace' fill='white'>3</text></svg>">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="app-page">

  <aside class="sidebar">
    <div class="logo">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="11" width="18" height="11" rx="2"/>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
      </svg>
      VaultBox
    </div>

    <nav class="sidebar-nav">
      <a href="/dashboard.html" class="nav-item">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
        My Documents
      </a>
      <a href="#" class="nav-item">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        Search
      </a>
      <a href="#" class="nav-item">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
        Recent Activity
      </a>
      <a href="#" class="nav-item">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        Shared with me
      </a>

      <div class="nav-section">Administration</div>
      <a href="/admin.html" class="nav-item active">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
        Admin Console
      </a>
    </nav>

    <div class="sidebar-footer">
      <div class="user-chip">
        <div class="avatar" id="avatar">?</div>
        <div class="user-chip-info">
          <div class="user-chip-name" id="chip-name">Loading…</div>
          <div class="user-chip-role" id="chip-role">user</div>
        </div>
      </div>
      <button class="btn-ghost" id="logout-btn" style="width:100%">Sign out</button>
    </div>
  </aside>

  <main class="main">
    <!-- 403 state -->
    <div class="status-page" id="view-denied">
      <div class="status-icon">🔒</div>
      <h2>Access Denied</h2>
      <p>You don't have permission to view this page.<br>This area is restricted to administrators.</p>
    </div>

    <!-- Admin content -->
    <div id="view-admin" class="hidden">
      <div class="page-header">
        <h1>Admin Console</h1>
      </div>

      <div class="card" style="margin-bottom:1rem">
        <div class="card-title">System Flag</div>
        <div class="flag-box" id="flag-display"></div>
      </div>

      <div class="card">
        <div class="card-title">User Management</div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>#</th>
                <th>Name</th>
                <th>Email</th>
                <th>Role</th>
                <th>Storage</th>
              </tr>
            </thead>
            <tbody id="user-table"></tbody>
          </table>
        </div>
      </div>
    </div>
  </main>

  <script src="/js/admin.js"></script>
</body>
</html>
