<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VaultBox - Sign In</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%23d29922'/><text y='22' x='16' text-anchor='middle' font-size='18' font-family='monospace' fill='white'>3</text></svg>">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="auth-page">

  <div class="auth-card">
    <div class="logo">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="11" width="18" height="11" rx="2"/>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
      </svg>
      VaultBox
    </div>

    <h1>Welcome back</h1>
    <p class="subtitle">Sign in to access your secure document vault</p>

    <div id="error" class="alert error hidden"></div>

    <form id="login-form">
      <div class="field">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" placeholder="yourname" autocomplete="username" autofocus required>
      </div>
      <button type="submit" class="btn-primary" id="submit-btn">Sign in</button>
    </form>

    <p class="auth-footer">Don't have an account? <a href="#">Create one for free</a></p>
  </div>

  <script src="/js/login.js"></script>
</body>
</html>
