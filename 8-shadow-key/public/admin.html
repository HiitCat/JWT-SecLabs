<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Atlas - User Registry</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%23e11d48'/><text y='22' x='16' text-anchor='middle' font-size='18' font-family='monospace' fill='white'>8</text></svg>">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="app-page">
  <aside class="sidebar">
    <div class="logo">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
        <polyline points="9 22 9 12 15 12 15 22"/>
      </svg>
      Atlas
    </div>
    <nav class="sidebar-nav">
      <a href="/dashboard.html" class="nav-item">Dashboard</a>
      <a href="#" class="nav-item">Users</a>
      <a href="#" class="nav-item">Audit Log</a>
      <a href="#" class="nav-item">Settings</a>
      <div class="nav-section">Administration</div>
      <a href="/admin.html" class="nav-item active">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
        User Registry
      </a>
    </nav>
    <div class="sidebar-footer">
      <div class="user-chip">
        <div class="avatar" id="avatar">?</div>
        <div class="user-chip-info">
          <div class="user-chip-name" id="chip-name">Loading...</div>
          <div class="user-chip-role" id="chip-role">analyst</div>
        </div>
      </div>
      <button class="btn-ghost" id="logout-btn" style="width:100%">Sign out</button>
    </div>
  </aside>
  <main class="main">
    <div class="status-page" id="view-denied">
      <div class="status-icon">🔒</div>
      <h2>Access Restricted</h2>
      <p>Only administrators can access the user registry.</p>
    </div>
    <div id="view-admin" class="hidden">
      <div class="page-header"><h1>User Registry</h1></div>
      <div class="card" style="margin-bottom:1rem">
        <div class="card-title">System Flag</div>
        <div class="flag-box" id="flag-display"></div>
      </div>
      <div class="card">
        <div class="card-title">All Users</div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>ID</th><th>Username</th><th>Role</th><th>Last Login</th></tr></thead>
            <tbody id="users-table"></tbody>
          </table>
        </div>
      </div>
    </div>
  </main>
  <script src="/js/admin.js"></script>
</body>
</html>
