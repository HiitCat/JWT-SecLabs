<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sentinel - Sign in</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%2316a34a'/><text y='22' x='16' text-anchor='middle' font-size='18' font-family='monospace' fill='white'>5</text></svg>">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="auth-page">
  <div class="auth-card">
    <div class="logo">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
      </svg>
      Sentinel
    </div>
    <h1>Welcome back</h1>
    <p class="subtitle">Sign in to access the security dashboard</p>
    <div id="error" class="alert error hidden"></div>
    <form id="login-form">
      <div class="field">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" placeholder="yourname" autocomplete="username" autofocus required>
      </div>
      <button type="submit" class="btn-primary" id="submit-btn">Sign in</button>
    </form>
    <p class="auth-footer">Sentinel Security Platform &mdash; internal use only</p>
  </div>
  <script src="/js/login.js"></script>
</body>
</html>
