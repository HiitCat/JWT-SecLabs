<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sentinel - Alert Center</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%2316a34a'/><text y='22' x='16' text-anchor='middle' font-size='18' font-family='monospace' fill='white'>5</text></svg>">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="app-page">
  <aside class="sidebar">
    <div class="logo">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
      </svg>
      Sentinel
    </div>
    <nav class="sidebar-nav">
      <a href="/dashboard.html" class="nav-item">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
        Dashboard
      </a>
      <a href="#" class="nav-item">Live Feed</a>
      <a href="#" class="nav-item">Reports</a>
      <a href="#" class="nav-item">Settings</a>
      <div class="nav-section">Administration</div>
      <a href="/admin.html" class="nav-item active">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
        Alert Center
      </a>
    </nav>
    <div class="sidebar-footer">
      <div class="user-chip">
        <div class="avatar" id="avatar">?</div>
        <div class="user-chip-info">
          <div class="user-chip-name" id="chip-name">Loading...</div>
          <div class="user-chip-role" id="chip-role">analyst</div>
        </div>
      </div>
      <button class="btn-ghost" id="logout-btn" style="width:100%">Sign out</button>
    </div>
  </aside>
  <main class="main">
    <div class="status-page" id="view-denied">
      <div class="status-icon">🔒</div>
      <h2>Access Restricted</h2>
      <p>Only administrators can view the alert center.</p>
    </div>
    <div id="view-admin" class="hidden">
      <div class="page-header"><h1>Alert Center</h1></div>
      <div class="card" style="margin-bottom:1rem">
        <div class="card-title">System Flag</div>
        <div class="flag-box" id="flag-display"></div>
      </div>
      <div class="card">
        <div class="card-title">Active Alerts</div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>ID</th><th>Severity</th><th>Message</th><th>Timestamp</th></tr></thead>
            <tbody id="alerts-table"></tbody>
          </table>
        </div>
      </div>
    </div>
  </main>
  <script src="/js/admin.js"></script>
</body>
</html>
